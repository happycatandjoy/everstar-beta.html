"gender",

// CANVAS
// =====================

const canvas =
document.getElementById(
"game"
);

const ctx =
canvas.getContext(
"2d"
);

function resize(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resize();

window.addEventListener(
"resize",
resize
);

// =====================
// GAME STATE
// =====================

let currentArea =
"academy";

let gameStarted =
false;

// =====================
// PLAYER
// =====================

let player = {

x:430,
y:500,

radius:20,

speed:4

};

// =====================
// KEYBOARD
// =====================

const keys = {};

window.addEventListener(
"keydown",
event=>{

keys[
event.key.toLowerCase()
] = true;

});

window.addEventListener(
"keyup",
event=>{

keys[
event.key.toLowerCase()
] = false;

});

// =====================
// JOYSTICK
// =====================

let joyX = 0;
let joyY = 0;

// create joystick

const joystick =
document.createElement(
"div"
);

joystick.id =
"joystick";

joystick.style.position =
"absolute";

joystick.style.left =
"20px";

joystick.style.bottom =
"20px";

joystick.style.width =
"140px";

joystick.style.height =
"140px";

joystick.style.border =
"4px solid white";

joystick.style.borderRadius =
"50%";

joystick.style.background =
"rgba(255,255,255,.15)";

joystick.style.display =
"none";

joystick.style.zIndex =
"200";

const stick =
document.createElement(
"div"
);

stick.style.position =
"absolute";

stick.style.left =
"45px";

stick.style.top =
"45px";

stick.style.width =
"50px";

stick.style.height =
"50px";

stick.style.borderRadius =
"50%";

stick.style.background =
"white";

joystick.appendChild(
stick
);

document.body.appendChild(
joystick
);

function updateJoystick(
clientX,
clientY
){

const rect =
joystick.getBoundingClientRect();

let dx =
clientX -
rect.left -
70;

let dy =
clientY -
rect.top -
70;

const distance =
Math.sqrt(
dx*dx +
dy*dy
);

const max = 45;

if(distance > max){

dx =
(dx/distance)
* max;

dy =
(dy/distance)
* max;

}

joyX = dx/max;
joyY = dy/max;

stick.style.left =
(45+dx) + "px";

stick.style.top =
(45+dy) + "px";

}

function resetJoystick(){

joyX = 0;
joyY = 0;

stick.style.left =
"45px";

stick.style.top =
"45px";

}

joystick.addEventListener(
"touchstart",
e=>{

const touch =
e.touches[0];

updateJoystick(
touch.clientX,
touch.clientY
);

}
);

joystick.addEventListener(
"touchmove",
e=>{

const touch =
e.touches[0];

updateJoystick(
touch.clientX,
touch.clientY
);

e.preventDefault();

}
);

joystick.addEventListener(
"touchend",
resetJoystick
);

joystick.addEventListener(
"touchcancel",
resetJoystick
);

// =====================
// PLAYER MOVEMENT
// =====================

function movePlayer(){

player.x +=
joyX * player.speed;

player.y +=
joyY * player.speed;

// WASD

if(keys["w"])
player.y -=
player.speed;

if(keys["s"])
player.y +=
player.speed;

if(keys["a"])
player.x -=
player.speed;

if(keys["d"])
player.x +=
player.speed;

// ARROWS

if(keys["arrowup"])
player.y -=
player.speed;

if(keys["arrowdown"])
player.y +=
player.speed;

if(keys["arrowleft"])
player.x -=
player.speed;

if(keys["arrowright"])
player.x +=
player.speed;

// bounds

player.x = Math.max(
20,
Math.min(
canvas.width-20,
player.x
)
);

player.y = Math.max(
20,
Math.min(
canvas.height-20,
player.y
)
);

}

// =====================
// PLAYER DRAWING
// =====================

function drawPlayer(){

ctx.fillStyle =
"#ff4444";

ctx.beginPath();

ctx.arc(
player.x,
player.y,
player.radius,
0,
Math.PI*2
);

ctx.fill();

// head

ctx.fillStyle =
playerData.skin;

ctx.beginPath();

ctx.arc(
player.x,
player.y-28,
14,
0,
Math.PI*2
);

ctx.fill();

// hair

ctx.fillStyle =
playerData.hair;

ctx.beginPath();

ctx.arc(
player.x,
player.y-32,
14,
Math.PI,
0
);

ctx.fill();

// eyes

ctx.fillStyle =
playerData.eyes;

ctx.beginPath();

ctx.arc(
player.x-4,
player.y-28,
2,
0,
Math.PI*2
);

ctx.fill();

ctx.beginPath();

ctx.arc(
player.x+4,
player.y-28,
2,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle =
"white";

ctx.font =
"16px Arial";

ctx.fillText(
playerData.name,
player.x-40,
player.y-55
);

}

// =====================
// HEADMASTER ORION
// =====================

const headmaster = {

x:430,
y:180

};

// =====================
// ACADEMY MAP
// =====================

function drawAcademy(){

ctx.fillStyle =
"#79c46a";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

// academy building

ctx.fillStyle =
"#c9b37e";

ctx.fillRect(
260,
60,
340,
120
);

ctx.fillStyle =
"black";

ctx.font =
"24px Arial";

ctx.fillText(
"EVERSTAR ACADEMY",
285,
130
);

// paths

ctx.strokeStyle =
"#d4c289";

ctx.lineWidth = 30;

ctx.beginPath();

ctx.moveTo(
430,
180
);

ctx.lineTo(
430,
580
);

ctx.stroke();

// headmaster

ctx.fillStyle =
"purple";

ctx.beginPath();

ctx.arc(
headmaster.x,
headmaster.y,
25,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle =
"white";

ctx.fillText(
"Headmaster Orion",
headmaster.x-70,
headmaster.y-40
);

drawPlayer();

}

// =====================
// START GAME OVERRIDE
// =====================

const originalStartGame =
startGame;

startGame = function(){

originalStartGame();

gameStarted =
true;

player.x = 430;
player.y = 500;

joystick.style.display =
"block";

};

// =====================
// GAME LOOP
// =====================

if(gameStarted){

movePlayer();

if(
currentArea ===
"academy"
){

drawAcademy();

}

}

requestAnimationFrame(
gameLoop
);

}

gameLoop();// =====================

340,
400,
90,
60

"#ffffff";

playerData.homeRealm ===

"#2e8b57";

playerData.homeRealm ===

"dorm";

player.x = 430;

true;

updateQuestText();

if(
orientationQuest.complete
){

}

}

// =====================
// DORM CHECK
// =====================

function checkDormEntry(){

if(
currentArea !==
"academy"
){
return;
}

const homeDorm =
dormBuildings[
playerData.homeRealm
];

if(

player.x >
homeDorm.x &&

player.x <
homeDorm.x + 120 &&

player.y >
homeDorm.y &&

player.y <
homeDorm.y + 80

){

enterDorm();

}

}

// =====================
// LEAVE DORM
// =====================

function checkDormExit(){

if(
currentArea !==
"dorm"
){
return;
}

const distance =
Math.hypot(
player.x - 70,
player.y - 70
);

if(distance < 40){

currentArea =
"academy";

player.x = 430;
player.y = 320;

}

}

// =====================

const forestEntrance = {

x:430,
y:320,

radius:60

};

let elderGuardianMet =
false;

// =====================
// DRAW FOREST PORTAL
// =====================

function drawForestPortal(){

if(!forestUnlocked)
return;

ctx.fillStyle =
"#0f3d0f";

ctx.beginPath();

ctx.arc(
forestEntrance.x,
forestEntrance.y,
forestEntrance.radius,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle =
"lime";

ctx.lineWidth = 4;

ctx.stroke();

ctx.fillStyle =
"white";

ctx.font =
"18px Arial";

ctx.fillText(
"Deep Dark Forest",
forestEntrance.x - 80,
forestEntrance.y + 95
);

}

// FOREST ENTRY
// =====================

function checkForestEntry(){

if(!forestUnlocked)
return;

if(
currentArea !==
"guardianHall"
)
return;

const distance =
Math.hypot(

player.x -
forestEntrance.x,

player.y -
forestEntrance.y

);

if(distance < 70){

currentArea =
"forest";

player.x = 430;
player.y = 520;

}

}

y:180

};

// =====================

// =====================

function drawForest(){

ctx.fillStyle =
"#102010";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

document
.getElementById(
"areaName"
).innerHTML =

"🌲 Deep Dark Forest of Doom";

// trees

for(let i=0;i<40;i++){

ctx.fillStyle =
"#0a300a";

ctx.beginPath();

(i * 73) % canvas.width,
(i * 41) % canvas.height,
25,
0,
Math.PI*2
);

}

"gold";

elderGuardian.x,
elderGuardian.y,
35,
0,
Math.PI*2
);

"white";

"20px Arial";

"Elder Guardian",
elderGuardian.x - 70,
elderGuardian.y - 50
);

"gold";

ctx.beginPath();

70,
70,
35,
0,
Math.PI*2
);

"black";

125
);
