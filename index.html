// =====================
// CHARACTER PREVIEW
// =====================

function drawPreview(){

document.getElementById(
"previewCanvas"
);

if(!preview) return;

const pctx =
preview.getContext("2d");

pctx.clearRect(
0,
0,
preview.width,
preview.height
);

// sky

pctx.fillStyle =
"#87ceeb";

pctx.fillRect(
0,
0,
preview.width,
preview.height
);

// body

pctx.fillStyle =
"#ff4444";

pctx.beginPath();

pctx.arc(
90,
100,
30,
0,
Math.PI*2
);

pctx.fill();

// head

document.getElementById(
"skinColor"
)?.value
|| playerData.skin;

pctx.beginPath();

pctx.arc(
90,

document.getElementById(

// =====================
// MOBILE JOYSTICK
// =====================

const joystick =
document.getElementById(
"joystick"
);

const stick =
document.getElementById(
"stick"
);

function updateJoystick(
clientX,
clientY
){

const rect =
joystick.getBoundingClientRect();

let dx =
clientX -
rect.left -
70;

let dy =
clientY -
rect.top -
70;

const distance =
Math.sqrt(
dx*dx +
dy*dy
);

const max = 45;

if(distance > max){

dx =
(dx/distance)
* max;

dy =
(dy/distance)
* max;

}

joyX = dx/max;
joyY = dy/max;

stick.style.left =
(45+dx)+"px";

stick.style.top =
(45+dy)+"px";

}

joystick.addEventListener(
"touchstart",
e=>{

const touch =
e.touches[0];

updateJoystick(
touch.clientX,
touch.clientY
);

}
);

joystick.addEventListener(
"touchmove",
e=>{

const touch =
e.touches[0];

updateJoystick(
touch.clientX,
touch.clientY
);

e.preventDefault();

}
);

function resetJoystick(){

joyX = 0;
joyY = 0;

stick.style.left =
"45px";

stick.style.top =
"45px";

}

joystick.addEventListener(
"touchend",
resetJoystick
);

joystick.addEventListener(
"touchcancel",
resetJoystick
);

// =====================
// MOVEMENT
// =====================

function movePlayer(){

// joystick

player.x +=
joyX * player.speed;

player.y +=
joyY * player.speed;

// WASD

if(keys["w"])
player.y -=
player.speed;

if(keys["s"])
player.y +=
player.speed;

if(keys["a"])
player.x -=
player.speed;

if(keys["d"])
player.x +=
player.speed;

// arrow keys

if(keys["arrowup"])
player.y -=
player.speed;

if(keys["arrowdown"])
player.y +=
player.speed;

if(keys["arrowleft"])
player.x -=
player.speed;

if(keys["arrowright"])
player.x +=
player.speed;

// world bounds

player.x = Math.max(
0,
Math.min(
world.width,
player.x
)
);

player.y = Math.max(
0,
Math.min(
world.height,
player.y
)
);

}
// =====================
// CAMERA FOLLOW
// =====================

function updateCamera(){

camera.x =
player.x -
(canvas.width / 2);

camera.y =
player.y -
(canvas.height / 2);

// keep camera inside world

camera.x = Math.max(
0,
Math.min(
world.width - canvas.width,
camera.x
)
);

camera.y = Math.max(
0,
Math.min(
world.height - canvas.height,
camera.y
)
);

}

x2:1500,
y2:1500

y1:1500,

// =====================
// DRAW MAIN WORLD
// =====================

function drawWorld(){

// grass

ctx.fillStyle =
"#5cae55";

ctx.fillRect(
0,
0,
canvas.width,
canvas.height
);

// roads

ctx.strokeStyle =
"#d4c289";

ctx.lineWidth = 40;

for(const road of roads){

ctx.beginPath();

ctx.moveTo(
road.x1-camera.x,
road.y1-camera.y
);

ctx.lineTo(
road.x2-camera.x,
road.y2-camera.y
);

ctx.stroke();

}

// plaza

ctx.fillStyle =
"gold";

ctx.beginPath();

ctx.arc(
1500-camera.x,
1500-camera.y,
120,
0,
Math.PI*2
);

ctx.fill();

ctx.fillStyle =
"black";

ctx.font =
"24px Arial";

ctx.fillText(
"EVERSTAR PLAZA",
1380-camera.x,
1500-camera.y
);

// guardian hall

ctx.fillStyle =
"#d1b15b";

ctx.fillRect(
guardianHall.x-camera.x,
guardianHall.y-camera.y,
guardianHall.w,
guardianHall.h
);

ctx.strokeStyle =
"#444";

ctx.lineWidth = 4;

ctx.strokeRect(
guardianHall.x-camera.x,
guardianHall.y-camera.y,
guardianHall.w,
guardianHall.h
);

ctx.fillStyle =
"black";

ctx.fillText(
"GUARDIAN HALL",
1410-camera.x,
1500-camera.y
);

// door

ctx.fillStyle =
"#654321";

ctx.fillRect(
1485-camera.x,
1540-camera.y,
30,
20
);

// trees

for(const tree of trees){

ctx.fillStyle =
"#6d4c41";

ctx.fillRect(
tree.x-camera.x-4,
tree.y-camera.y,
8,
18
);

ctx.fillStyle =
"darkgreen";

ctx.beginPath();

ctx.arc(
tree.x-camera.x,
tree.y-camera.y,
18,
0,
Math.PI*2
);

ctx.fill();

}

// portals

for(const realm of realms){

ctx.fillStyle =
realm.color;

ctx.beginPath();

ctx.arc(
realm.x-camera.x,
realm.y-camera.y,
60,
0,
Math.PI*2
);

ctx.fill();

ctx.strokeStyle =
"white";

ctx.lineWidth = 5;

ctx.stroke();

ctx.fillStyle =
"white";

ctx.font =
"16px Arial";

ctx.fillText(
realm.name,
realm.x-camera.x-45,
realm.y-camera.y+90
);

}

// area text

document
.getElementById(
"areaName"
).innerHTML =
"⭐ Everstar Plaza";

}

// =====================

// =====================

function useAction(){

// enter guardian hall

if(currentRealm === "world"){

const hallDistance =
Math.hypot(
player.x - 1500,
player.y - 1500
);

if(hallDistance < 180){

currentRealm =
"hall";

return;

}

// enter portals

for(const realm of realms){

const distance =
Math.hypot(
player.x - realm.x,
player.y - realm.y
);

if(distance < 90){

enterRealm(
realm.key
);

return;

}

}

}

// leave realms

if(

currentRealm === "earth" ||
currentRealm === "water" ||
currentRealm === "fire" ||
currentRealm === "air"

){

leaveRealm();

return;

}

// exit hall

if(currentRealm === "hall"){

leaveRealm();

return;

}

}

// =====================
// ACTION BUTTON
// =====================

document
.getElementById(
"actionBtn"
)
.addEventListener(
"click",
useAction
);

// keyboard action

window.addEventListener(
"keydown",
e=>{

if(
e.key.toLowerCase()
=== "e"
){

useAction();

}

}
);

// =====================
// REALM PROGRESS
// =====================

function updateRealmProgress(){

if(currentRealm === "earth")
quests.earth = true;

if(currentRealm === "water")
quests.water = true;

if(currentRealm === "fire")
quests.fire = true;

if(currentRealm === "air")
quests.air = true;

updateQuestText();

}

// =====================
// HOME REALM BONUS
// =====================

function applyRealmBonus(){

switch(
playerData.homeRealm
){

case "earth":

player.speed = 5;
break;

case "water":

player.speed = 7;
break;

case "fire":

player.speed = 6;
break;

case "air":

player.speed = 8;
break;

}

}

// =====================
// STARTUP
// =====================

updateQuestText();

applyRealmBonus();
// =====================
// PLAYER RENDER
// =====================

function drawPlayer(){

const screenX =
canvas.width / 2;

const screenY =
canvas.height / 2;

// body

ctx.fillStyle =
"#ff4444";

ctx.beginPath();

ctx.arc(
screenX,
screenY,
player.radius,
0,
Math.PI * 2
);

ctx.fill();

// outline

ctx.strokeStyle =
"white";

ctx.lineWidth = 4;

ctx.stroke();

// head

ctx.fillStyle =
playerData.skin;

ctx.beginPath();

ctx.arc(
screenX,
screenY - 35,
18,
0,
Math.PI * 2
);

ctx.fill();

// hair

ctx.fillStyle =
playerData.hair;

ctx.beginPath();

ctx.arc(
screenX,
screenY - 40,
18,
Math.PI,
0
);

ctx.fill();

// eyes

ctx.fillStyle =
playerData.eyes;

ctx.beginPath();
ctx.arc(
screenX - 5,
screenY - 35,
2,
0,
Math.PI*2
);
ctx.fill();

ctx.beginPath();
ctx.arc(
screenX + 5,
screenY - 35,
2,
0,
Math.PI*2
);
ctx.fill();

// name

ctx.fillStyle =
"white";

ctx.font =
"18px Arial";

ctx.fillText(
playerData.name,
screenX - 40,
screenY - 70
);

// realm badge

ctx.font =
"14px Arial";

ctx.fillText(
playerData.homeRealm.toUpperCase(),
screenX - 30,
screenY + 60
);

}

// =====================
// REALM SWITCHING
// =====================

function drawCurrentArea(){

updateRealmProgress();

if(currentRealm === "world"){
drawWorld();
}

if(currentRealm === "hall"){
drawGuardianHall();
}

if(currentRealm === "earth"){
drawEarthRealm();
}

if(currentRealm === "water"){
drawWaterRealm();
}

if(currentRealm === "fire"){
drawFireRealm();
}

if(currentRealm === "air"){
drawAirRealm();
}

}

// =====================
// GAME LOOP
// =====================

function gameLoop(){

movePlayer();

updateCamera();

drawCurrentArea();

if(currentRealm === "world"){
drawPlayer();
}

requestAnimationFrame(
gameLoop
);

}

// =====================
// START GAME
// =====================

drawPreview();

updateQuestText();

gameLoop();

</script>
